<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logica and Algorithms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    h1 {
      margin-bottom: 20px;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin: 8px 0;
    }
    .muted {
      color: #666;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>Logica and Algorithms</h1>

  <h2>Table of Contents</h2>
  <div id="toc">
    <p class="muted">Loading pages...</p>
  </div>

  <script>
    async function loadTOC() {
      const owner = "MrGiudice";
      const repo = "Logic-and-Algorithms";
      const branch = "main";
      const tocEl = document.getElementById("toc");

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`);
        if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);

        const files = await res.json();

        const pages = files
          .filter(item =>
            item.type === "file" &&
            item.name.toLowerCase().endsWith(".html") &&
            item.name.toLowerCase() !== "index.html"
          )
          .sort((a, b) => a.name.localeCompare(b.name));

        if (pages.length === 0) {
          tocEl.innerHTML = "<p class='muted'>No additional HTML pages found.</p>";
          return;
        }

        tocEl.innerHTML = `
          <ul>
            ${pages.map(p => `<li><a href="./${p.name}">${p.name}</a></li>`).join("")}
          </ul>
        `;
      } catch (err) {
        tocEl.innerHTML = `<p class="muted">Could not load table of contents: ${err.message}</p>`;
      }
    }

    loadTOC();
  </script>
</body>
</html>
